<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Neonowy Licznik</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

.container {
    text-align: center;
}

.timer {
    color: #b6ff00;
    font-size: 100px;
    font-weight: bold;
    text-shadow:
        0 0 10px #b6ff00,
        0 0 30px #b6ff00,
        0 0 60px #b6ff00;
}


input {
    margin-top:40px;
    background:black;
    color:#b6ff00;
    border:2px solid #b6ff00;
    padding:12px;
    width:200px;
    font-size:20px;
    text-align:center;
}


button {
    padding:12px 25px;
    margin-left:10px;
    background:#b6ff00;
    border:none;
    font-size:20px;
    cursor:pointer;
}

button:hover {
    box-shadow:0 0 20px #b6ff00;
}

</style>
</head>


<body>

<div class="container">

<div class="timer" id="timer">
24:00:00
</div>

<input id="add" type="number" placeholder="Minuty">

<button onclick="addTime()">DODAJ</button>

</div>



<script>

let seconds = 24 * 3600;


// WCZYTYWANIE CZASU
if(localStorage.time){

    seconds = Number(localStorage.time);

    let last = Number(localStorage.last);

    let passed = Math.floor(
        (Date.now() - last) / 1000
    );

    seconds -= passed;
}



// FORMAT HH:MM:SS
function format(sec){

    if(sec < 0) sec = 0;

    let h = Math.floor(sec / 3600);
    let m = Math.floor((sec % 3600) / 60);
    let s = sec % 60;


    return String(h).padStart(2,"0")
    +":"
    +String(m).padStart(2,"0")
    +":"
    +String(s).padStart(2,"0");
}



// UPDATE
function update(){

    document.getElementById("timer").innerHTML =
    format(seconds);

}


function save(){

    localStorage.time = seconds;
    localStorage.last = Date.now();

}



// ODLICZANIE

setInterval(()=>{

    if(seconds > 0){
        seconds--;
    }

    update();
    save();

},1000);




// DODAWANIE RĘCZNE

function addTime(){

    let min =
    Number(document.getElementById("add").value);


    if(min > 0){

        seconds += min * 60;

        save();
        update();

    }

    document.getElementById("add").value="";

}




// LOSOWE BONUSY

function randomBonus(){


    let r = Math.random();

    let min;


    if(r < 0.45){

        // 1-10 minut
        min = Math.floor(Math.random()*10)+1;

    }

    else if(r < 0.75){

        // 11-30 minut
        min = Math.floor(Math.random()*20)+11;

    }

    else if(r < 0.95){

        //31-50 minut
        min = Math.floor(Math.random()*20)+31;

    }

    else {

        //51-60 minut
        min = Math.floor(Math.random()*10)+51;

    }


    seconds += min*60;

    save();

}



// losowanie co 5-15 minut

function bonusLoop(){

    randomBonus();


    let next =
    Math.random()*600000 + 300000;


    setTimeout(bonusLoop,next);

}


bonusLoop();


update();

</script>


</body>
</html>
