<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<title>Neonowy Licznik</title>

<style>

body {
    margin:0;
    height:100vh;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
}


.container {
    text-align:center;
}


.timer {

    color:#b6ff00;
    font-size:100px;
    font-weight:bold;

    text-shadow:
    0 0 10px #b6ff00,
    0 0 30px #b6ff00,
    0 0 60px #b6ff00;

}



.dayCounter {

    margin-top:25px;

    color:#b6ff00;
    font-size:45px;
    font-weight:bold;

    text-shadow:
    0 0 10px #b6ff00,
    0 0 30px #b6ff00;

}



input {

    margin-top:35px;

    padding:12px;

    width:200px;

    background:black;

    color:#b6ff00;

    border:2px solid #b6ff00;

    font-size:20px;

    text-align:center;

}



button {

    padding:12px 20px;

    margin-left:10px;

    background:#b6ff00;

    color:black;

    border:none;

    font-size:20px;

    cursor:pointer;

}



button:hover {

    box-shadow:0 0 20px #b6ff00;

}


</style>

</head>


<body>


<div class="container">


<div class="timer" id="timer">
24:00:00
</div>


<div class="dayCounter" id="dayCounter">
Dzień 0
</div>



<input id="addTime" type="number" placeholder="Dodaj minuty">

<button onclick="addMinutes()">
DODAJ
</button>


<br>


<input id="days" type="number" placeholder="Numer dnia">

<button onclick="setDay()">
USTAW
</button>


</div>




<script>


let seconds = 24 * 60 * 60;



// WCZYTANIE CZASU

if(localStorage.time){

    seconds = Number(localStorage.time);


    let last = Number(localStorage.last);


    let passed = Math.floor(
        (Date.now()-last)/1000
    );


    seconds -= passed;

}




// DNI

let dayNumber =
Number(localStorage.day || 0);





function formatTime(sec){


    if(sec < 0)
        sec = 0;


    let h = Math.floor(sec/3600);

    let m = Math.floor((sec%3600)/60);

    let s = sec%60;


    return String(h).padStart(2,"0")
    +":"
    +String(m).padStart(2,"0")
    +":"
    +String(s).padStart(2,"0");


}




function update(){


    document.getElementById("timer").innerHTML =
    formatTime(seconds);


}




function updateDay(){


    document.getElementById("dayCounter").innerHTML =
    "Dzień " + dayNumber;


}




function save(){


    localStorage.time = seconds;

    localStorage.last = Date.now();


}





// GŁÓWNY LICZNIK


setInterval(()=>{


    if(seconds > 0){

        seconds--;

    }


    update();

    save();


},1000);







// DODAWANIE MINUT


function addMinutes(){


    let value =
    Number(document.getElementById("addTime").value);



    if(value > 0){


        seconds += value * 60;


        save();

        update();


    }



    document.getElementById("addTime").value="";


}







// USTAWIANIE DNIA


function setDay(){


    let value =
    Number(document.getElementById("days").value);



    if(value > 0){


        dayNumber = value;


        localStorage.day = dayNumber;


        updateDay();


    }


    document.getElementById("days").value="";


}






update();

updateDay();


</script>


</body>
</html>
